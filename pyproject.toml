[project]
name = "nexus"
version = "0.1.0"
description = "Privacy-first intelligent document management and analysis platform."
requires-python = ">=3.13,<3.15"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true